openapi: 3.0.3
info:
  title: ticent — War Ticket API
  version: 1.0.0
  description: >
    API simulasi penjualan tiket event berkuota terbatas (waiting room, sesi belanja terbatas,
    hold 30 menit, anti-oversell PostgreSQL, dan pembayaran Midtrans Sandbox).

servers:
  - url: http://localhost:8080
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    X-Request-ID:
      description: ID pelacakan request end-to-end
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: terjadi kesalahan

    User:
      type: object
      required: [id, email, full_name, role, created_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time

    Event:
      type: object
      required:
        - id
        - name
        - venue
        - status
        - sale_starts_at
        - max_active_sessions
        - max_tickets_per_user
        - session_minutes
        - hold_minutes
        - created_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        venue:
          type: string
        poster_url:
          type: string
          format: uri
          nullable: true
          description: URL gambar poster/hero event (http/https, opsional)
        status:
          type: string
          enum: [draft, published]
        sale_starts_at:
          type: string
          format: date-time
        max_active_sessions:
          type: integer
        max_tickets_per_user:
          type: integer
        session_minutes:
          type: integer
        hold_minutes:
          type: integer
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, event_day_id, name, price, total_seats, available, has_seats, sold_out]
      properties:
        id:
          type: integer
          format: int64
        event_day_id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
          description: Harga dalam rupiah (integer)
        total_seats:
          type: integer
        available:
          type: integer
        has_seats:
          type: boolean
        sold_out:
          type: boolean

    EventDay:
      type: object
      required: [id, event_id, label, show_date, sold_out]
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        label:
          type: string
          example: DAY-1
        show_date:
          type: string
          format: date-time
        sold_out:
          type: boolean
        event:
          $ref: "#/components/schemas/Event"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    QueueEntry:
      type: object
      required: [id, event_id, user_id, status, joined_at]
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        position:
          type: integer
          nullable: true
        status:
          type: string
          enum: [waiting, active, checkout, done, expired, left]
        joined_at:
          type: string
          format: date-time
        admitted_at:
          type: string
          format: date-time
          nullable: true
        session_expires_at:
          type: string
          format: date-time
          nullable: true

    QueueStatusView:
      type: object
      required: [entry_id, status, total_in_line, sale_starts_at]
      properties:
        entry_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [waiting, active, checkout, done, expired, left]
        position_in_line:
          type: integer
          nullable: true
          description: null sebelum jam war, 0 saat sudah lolos (active/checkout)
        total_in_line:
          type: integer
        sale_starts_at:
          type: string
          format: date-time
        session_expires_at:
          type: string
          format: date-time
          nullable: true

    OrderItem:
      type: object
      required: [id, order_id, category_id, qty, unit_price]
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        qty:
          type: integer
        unit_price:
          type: integer
          format: int64

    Order:
      type: object
      required:
        - id
        - user_id
        - event_id
        - event_day_id
        - status
        - total_amount
        - midtrans_order_id
        - hold_expires_at
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        event_day_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, paid, expired, failed]
        total_amount:
          type: integer
          format: int64
        midtrans_order_id:
          type: string
        snap_token:
          type: string
        snap_redirect_url:
          type: string
        hold_expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    PayResult:
      type: object
      required: [snap_token, redirect_url]
      properties:
        snap_token:
          type: string
        redirect_url:
          type: string

    TicketView:
      type: object
      required:
        - id
        - order_id
        - event_name
        - venue
        - day_label
        - show_date
        - category_name
        - code
        - created_at
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        event_name:
          type: string
        venue:
          type: string
        day_label:
          type: string
        show_date:
          type: string
          format: date-time
        category_name:
          type: string
        seat_no:
          type: integer
          nullable: true
          description: null untuk kategori berdiri (Festival)
        code:
          type: string
          example: TKT-6NQ2A8...
        created_at:
          type: string
          format: date-time

paths:
  /healthz:
    get:
      summary: Cek kesehatan server & koneksi PostgreSQL
      responses:
        "200":
          description: Database sehat
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: Database tidak dapat dijangkau

  /auth/register:
    post:
      summary: Daftar akun pembeli baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, password]
              properties:
                email:
                  type: string
                  format: email
                full_name:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: Login dan dapatkan token JWT (berlaku 24 jam)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      summary: Informasi user dari token JWT
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ID dan role user aktif
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id:
                    type: integer
                    format: int64
                  role:
                    type: string
        "401":
          description: Token tidak ada atau tidak valid

  /admin/events:
    post:
      summary: Admin membuat event baru (status draft)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, venue, sale_starts_at]
              properties:
                name:
                  type: string
                venue:
                  type: string
                poster_url:
                  type: string
                  format: uri
                  nullable: true
                sale_starts_at:
                  type: string
                  format: date-time
                max_active_sessions:
                  type: integer
                  minimum: 1
                  maximum: 1000
                max_tickets_per_user:
                  type: integer
                  minimum: 1
                  maximum: 10
                session_minutes:
                  type: integer
                  minimum: 5
                  maximum: 120
      responses:
        "201":
          description: Event draft dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Validasi gagal
        "401":
          description: Belum login
        "403":
          description: Bukan admin

  /admin/events/{id}/days:
    post:
      summary: Admin menambah hari pertunjukan ke event draft
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, show_date]
              properties:
                label:
                  type: string
                  example: DAY-1
                show_date:
                  type: string
                  example: "2026-12-10"
      responses:
        "201":
          description: Hari pertunjukan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDay"
        "400":
          description: Validasi gagal
        "404":
          description: Event tidak ditemukan
        "409":
          description: Event sudah published atau label hari duplikat

  /admin/days/{id}/categories:
    post:
      summary: Admin menambah kategori tiket ke satu hari pertunjukan
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, total_seats]
              properties:
                name:
                  type: string
                  example: VIP
                price:
                  type: integer
                  format: int64
                  minimum: 0
                total_seats:
                  type: integer
                  minimum: 1
                has_seats:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Validasi gagal
        "404":
          description: Hari/event tidak ditemukan
        "409":
          description: Event sudah published atau nama kategori duplikat

  /admin/events/{id}/publish:
    post:
      summary: Admin mem-publish event ke katalog
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Event ter-publish
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: published
        "400":
          description: Event belum punya hari atau kategori
        "404":
          description: Event tidak ditemukan
        "409":
          description: Event sudah published

  /catalog:
    get:
      summary: Daftar kartu katalog publik (satu kartu per hari pertunjukan yang belum lewat)
      responses:
        "200":
          description: Daftar hari pertunjukan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDay"

  /catalog/{id}:
    get:
      summary: Detail satu hari pertunjukan beserta kategori & sisa stok
      parameters:
        - name: id
          in: path
          required: true
          description: ID hari pertunjukan (event_days.id)
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detail hari pertunjukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDay"
        "404":
          description: Hari tidak ditemukan, masih draft, atau sudah lewat

  /events/{id}/queue:
    post:
      summary: Masuk waiting room event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: Berhasil masuk antrean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "404":
          description: Event tidak ditemukan atau belum published
        "409":
          description: User masih punya entri antrean hidup di event ini
    delete:
      summary: Keluar dari antrean event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Berhasil keluar dari antrean
        "404":
          description: User tidak sedang antre/belanja di event ini

  /events/{id}/queue/me:
    get:
      summary: Lihat posisi antrean saat ini (tanpa memperbarui heartbeat)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Posisi antrean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatusView"
        "404":
          description: Tidak sedang antre di event ini

  /events/{id}/queue/heartbeat:
    post:
      summary: Kirim sinyal hadir (heartbeat) dan terima posisi terbaru
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Posisi antrean terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatusView"
        "404":
          description: Tidak sedang antre/belanja di event ini

  /events/{id}/queue/stream:
    get:
      summary: Aliran posisi antrean real-time (Server-Sent Events)
      description: >
        Mengirim event `position` setiap 2 detik selama status `waiting` atau `active`,
        dan menutup aliran dengan event status terakhir (`checkout`, `expired`, `left`, `done`).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Aliran SSE
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Belum pernah masuk antrean event ini

  /orders:
    post:
      summary: Checkout dan tahan tiket selama 30 menit (wajib berstatus active di antrean)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_day_id, items]
              properties:
                event_day_id:
                  type: integer
                  format: int64
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [category_id, qty]
                    properties:
                      category_id:
                        type: integer
                        format: int64
                      qty:
                        type: integer
                        minimum: 1
      responses:
        "201":
          description: Order dibuat dan tiket ditahan 30 menit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Isi keranjang tidak valid
        "404":
          description: Hari pertunjukan tidak tersedia
        "409":
          description: Belum jam war, belum lolos antrean, stok habis, kuota penuh, atau masih ada order pending

  /orders/{id}:
    get:
      summary: Detail order milik user yang sedang login
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Detail order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order tidak ditemukan atau milik user lain

  /orders/{id}/pay:
    post:
      summary: Buat atau ambil ulang token Midtrans Snap (idempoten)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Token dan URL pembayaran Snap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResult"
        "404":
          description: Order tidak ditemukan atau milik user lain
        "409":
          description: Order sudah tidak pending atau waktu hold sudah habis

  /orders/{id}/sync:
    post:
      summary: Tarik status pembayaran terbaru dari Midtrans Status API (alur lokal tanpa tunnel)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Order dengan status terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order tidak ditemukan atau milik user lain

  /payments/midtrans/notification:
    post:
      summary: Webhook notifikasi pembayaran dari Midtrans (verifikasi SHA-512, idempoten)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status_code, gross_amount, signature_key, transaction_status]
              properties:
                order_id:
                  type: string
                status_code:
                  type: string
                gross_amount:
                  type: string
                  example: "500000.00"
                signature_key:
                  type: string
                transaction_status:
                  type: string
                fraud_status:
                  type: string
      responses:
        "200":
          description: Notifikasi diproses
        "400":
          description: Payload tidak valid atau gross_amount tidak cocok
        "403":
          description: Signature SHA-512 tidak valid
        "404":
          description: order_id tidak dikenal

  /tickets:
    get:
      summary: Daftar e-ticket milik user yang sedang login
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daftar e-ticket (array kosong [] bila belum punya)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketView"
