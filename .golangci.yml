version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1005
    gosec:
      excludes:
        - G706 # log/slog memakai JSONHandler yang otomatis meng-escape karakter kontrol
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
